<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div id="notification-container"></div>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card p-4">
            <h2 class="text-center mb-4">Verify OTP</h2>
            <div id="countdown" class="text-center mb-3"></div>
            <div id="resend" class="text-center d-none">
                <p>OTP has expired. <a href="#" id="resendLink">Resend OTP</a></p>
            </div>
            <div id="error" class="alert alert-danger d-none"></div>
            <form id="otpForm">
                <div class="mb-3">
                    <label for="otp" class="form-label">Enter OTP</label>
                    <input type="text" class="form-control" id="otp" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Verify</button>
            </form>
        </div>
    </div>
    <script src="/js/notifications.js"></script>
    <script src="/js/verifyOtp.js"></script>
</body>
</html>
